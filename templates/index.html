<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rap Name Generator</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #111;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    #name {
      font-size: 2.5rem;
      font-weight: bold;
      margin: 1.5rem 0;
      min-height: 3rem;
      text-align: center;
    }
    button {
      font-size: 1.1rem;
      padding: 0.8rem 2rem;
      border: none;
      border-radius: 8px;
      background: #f5c518;
      cursor: pointer;
    }
    button:hover { background: #ffd84a; }
  </style>
</head>
<body>
  <h1>Rap Name Generator</h1>
  <div id="name">Click the button</div>
  <button id="generate-btn">Generate Name</button>

  <script>
    const nameEl = document.getElementById("name");

    document.getElementById("generate-btn").addEventListener("click", async () => {
      const response = await fetch("/generate");
      const data = await response.json();
      nameEl.textContent = data.name;
    });
  </script>
</body>
</html>
